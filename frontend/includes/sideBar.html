        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </li>
  </ul>
</div>
<script>
(function () {
  const basename = (p) => (p || "").split("/").filter(Boolean).pop() || "";

  const currentPath = location.pathname;
  const currentBase = basename(currentPath);

  const links = document.querySelectorAll(".sidebar-menu a");
  if (!links.length) return;

  links.forEach(a => a.classList.remove("active"));

  for (const a of links) {
    if (a.classList.contains("logout")) continue;

    const href = a.getAttribute("href");
    if (!href || href === "#") continue;

    const linkPath = new URL(href, location.origin).pathname;
    const linkBase = basename(linkPath);

    if (currentPath === linkPath || (currentBase && linkBase && currentBase === linkBase)) {
      a.classList.add("active");
      break; 
    }
  }
})();
</script>
