<header class="site-header" style="background:#fff;border-bottom:1px solid #ddd;">
  <div class="header-inner" style="max-width:1200px;margin:0 auto;padding:16px 20px;
              display:flex;align-items:center;justify-content:space-between;">

    <!-- LOGO -->
    <a href="/TUBES_2_Toko/index.html" style="text-decoration:none;">
      <img src="/TUBES_2_Toko/frontend/assets/Logo Feyora.png"
           alt="Feyora"
           style="width:100px;height:auto;">
    </a>

    <!-- NAV -->
    <nav class="topnav">
      <a href="/TUBES_2_Toko/frontend/product/listProduct.html?sort=newest">New Arrivals</a>
      <a href="/TUBES_2_Toko/frontend/product/listProduct.html">Shop Now</a>
      <a href="/TUBES_2_Toko/frontend/product/listProduct.html?collection=studio">Studio Collection</a>
      <a href="/TUBES_2_Toko/frontend/product/listProduct.html?laststock=1">Last Stock</a>
    </nav>

    <!-- ACTIONS -->
    <div style="display:flex;align-items:center;gap:16px;">

      <!-- GUEST -->
      <div id="header-guest" style="display:flex;gap:16px;align-items:center;">
        <a id="login-link"
           href="/TUBES_2_Toko/frontend/auth/login.html"
           style="text-decoration:none;color:#333;font-weight:500;">
          Login
        </a>

        <a id="guest-cart-link" href="#" style="font-size:22px;color:#333;">
          <i class="bi bi-cart4"></i>
        </a>
      </div>

      <!-- LOGGED IN -->
      <div id="header-loggedin" style="display:none;gap:16px;align-items:center;">
        <a href="/TUBES_2_Toko/backend/cart/listCart.php"
           style="font-size:22px;color:#333;">
          <i class="bi bi-cart4"></i>
        </a>

        <div class="profile-menu" style="position:relative;">
          <button class="profile-toggle"
                  type="button"
                  style="display:flex;align-items:center;gap:10px;
                         background:none;border:none;cursor:pointer;">

            <div id="profile-avatar"
                 style="width:38px;height:38px;border-radius:50%;
                        background:#ddd;border:2px solid #ccc;
                        display:flex;align-items:center;justify-content:center;
                        font-weight:700;color:#555;overflow:hidden;">
            </div>

            <span id="profile-name" style="font-weight:500;color:#333;">
              User
            </span>
          </button>
        </div>
        <!-- DROPDOWN -->
        <div id="profile-dropdown"
          style="display:none;position:absolute;top:48px;right:0;
                  background:#fff;border-radius:8px;
                  box-shadow:0 4px 14px rgba(0,0,0,.12);
                  min-width:180px;z-index:999;overflow:hidden;">
          <a href="/TUBES_2_Toko/frontend/user/settingProfile.html"
            style="display:flex;align-items:center;gap:10px;padding:10px 16px;text-decoration:none;color:#333;">
            <i class="bi bi-gear"></i> Settings
          </a>

          <a href="/TUBES_2_Toko/backend/auth/logout.php" id="logout-link"
            style="display:flex;align-items:center;gap:10px;padding:10px 16px;
                    text-decoration:none;color:#d00;font-weight:600;">
            <i class="bi bi-box-arrow-right"></i> Logout
          </a>
        </div>
      </div>

    </div>
  </div>
</header>

<script>
window.initHeaderAuth = async function () {
  if (window.__HEADER_AUTH_INITED__) return;
  window.__HEADER_AUTH_INITED__ = true;

  const API_ME = "/TUBES_2_Toko/backend/auth/me.php";

  const guest = document.getElementById("header-guest");
  const user  = document.getElementById("header-loggedin");
  const avatar = document.getElementById("profile-avatar");
  const nameEl = document.getElementById("profile-name");
  const dropdown = document.getElementById("profile-dropdown");
  const toggle = document.querySelector(".profile-toggle");
  const logout = document.getElementById("logout-link");

  const initials = (name) => {
    if (!name) return "";
    return name.trim().substring(0, 2).toUpperCase();
  };

  function showGuest(){
    if (guest) guest.style.display="flex";
    if (user)  user.style.display="none";
  }

  function showUser(u){
    if (guest) guest.style.display = "none";
    if (user)  user.style.display = "flex";

    if (nameEl) nameEl.textContent = u.username || "";

    if (avatar) {
      avatar.innerHTML = "";

      if (u.profile_photo_url) {
        const img = document.createElement("img");
        img.src = u.profile_photo_url; // sudah dari frontend/assets/profile/
        img.alt = u.username || "User";
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "cover";
        avatar.appendChild(img);
      } else {
        avatar.textContent = initials(u.username);
      }
    }
  }

  if (toggle && dropdown) {
    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    });

    document.addEventListener("click", () => {
      dropdown.style.display = "none";
    });

    dropdown.addEventListener("click", (e) => {
      e.stopPropagation();
    });
  }

  if (logout) {
    logout.addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = "/TUBES_2_Toko/backend/auth/logout.php";
    });
  }

  try {
    const res = await fetch(API_ME,{credentials:"include",cache:"no-cache"});
    const data = await res.json();
    if (data.ok && data.logged_in) showUser(data.user);
    else showGuest();
  } catch {
    showGuest();
  }
};
</script>
