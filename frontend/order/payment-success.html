<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment Success</title>
<link rel="stylesheet" href="../styles/payment.css">
</head>
<body style="background:#faf7f9;">

<div class="box" style="
  background:white;
  padding:30px;
  width:400px;
  margin:80px auto;
  border-radius:12px;
  box-shadow:0 0 10px #ddd;
  text-align:center;
">
  <h2 style="color:#28a745;">Payment Successful!</h2>
  <p>Your transaction has been completed.</p>

  <div id="detail">Loading...</div>

  <a href="/TUBES_2_Toko/index.html"
     style="
      display:inline-block;
      margin-top:20px;
      background:#ff2d7a;
      color:white;
      padding:12px 20px;
      border-radius:8px;
      text-decoration:none;
     ">
    Continue Shopping
  </a>
</div>

<script>
const id = new URLSearchParams(location.search).get("transaction_id");

fetch("/TUBES_2_Toko/backend/order/paymentSuccess.php?transaction_id=" + id,
      { credentials:"include" })
.then(r=>r.json())
.then(d=>{
  document.getElementById("detail").innerHTML = `
    <p><b>ID:</b> ${id}</p>
    <p><b>Total:</b> Rp ${Number(d.total_price).toLocaleString("id-ID")}</p>
    <p><b>Date:</b> ${d.date_created}</p>
    <p><b>Status:</b> ${d.status}</p>
  `;
});
</script>

</body>
</html>
