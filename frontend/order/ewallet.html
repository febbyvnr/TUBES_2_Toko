<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembayaran E-Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link rel="stylesheet" href="../styles/payment.css">
</head>

<body class="ewallet-page">

<div class="ewallet-container">

  <h2 class="ewallet-title">
    Pembayaran E-Wallet (<span id="wallet-name">OVO</span>)
  </h2>

  <!-- INFO TOP -->
  <div class="ewallet-row">
    <div>
      <div class="label">Total Pembayaran</div>
    </div>
    <div class="price" id="total">Rp 0</div>
  </div>

  <div class="ewallet-row">
    <div>
      <div class="label">Bayar Dalam</div>
    </div>
    <div>
      <div class="countdown" id="countdown">--</div>
      <div class="deadline" id="deadline">-</div>
    </div>
  </div>

  <hr>

  <!-- WALLET -->
  <div class="wallet-box">
    <img id="wallet-logo" class="wallet-logo">
    <b id="wallet-label">OVO</b>
  </div>

  <div class="label">Nomor Pembayaran</div>
  <div class="wallet-number">
    <span id="wallet-number">085555555555</span>
    <span class="copy-btn" onclick="copyNumber()">SALIN</span>
  </div>

  <hr>

  <!-- INSTRUCTION -->
  <h4 class="instruction-title">
    Cara Membayar via <span id="wallet-instruction">OVO</span>
  </h4>

  <ol class="instruction-list">
    <li>Buka aplikasi <b id="wallet-instruction2">OVO</b></li>
    <li>Pilih menu <b>Transfer</b></li>
    <li>Masukkan nomor tujuan <b id="wallet-number2">085555555555</b></li>
    <li>Masukkan nominal pembayaran</li>
    <li>Klik <b>Bayar</b> untuk menyelesaikan transaksi</li>
  </ol>

  <!-- BUTTON -->
  <button class="btn-check" onclick="checkStatus()">
    Check Status
  </button>

</div>

<script>
const params = new URLSearchParams(location.search);
const type = (params.get("type") || "ovo").toLowerCase();
const trxId = params.get("transaction_id");

/* WALLET CONFIG (JANGAN UBAH UI) */
const WALLET_MAP = {
  ovo: {
    label: "OVO",
    logo: "ovo.png"
  },
  gopay: {
    label: "GOPAY",
    logo: "gopay.png"
  },
  dana: {
    label: "DANA",
    logo: "dana.png"
  }
};

/* FALLBACK */
const wallet = WALLET_MAP[type] || WALLET_MAP.ovo;

/* SET TEXT */
document.getElementById("wallet-name").innerText = wallet.label;
document.getElementById("wallet-label").innerText = wallet.label;
document.getElementById("wallet-instruction").innerText = wallet.label;
document.getElementById("wallet-instruction2").innerText = wallet.label;

/* SET LOGO (ABSOLUTE PATH, AMAN) */
document.getElementById("wallet-logo").src =
  `/TUBES_2_Toko/frontend/assets/${wallet.logo}`;

/* DUMMY DATA (SEMENTARA) */
document.getElementById("total").innerText = "Rp 3.306.000";
document.getElementById("deadline").innerText = "Jatuh tempo 14 Dec 2025, 01:16";

startCountdown(24 * 60 * 60);

function startCountdown(seconds){
  let s = seconds;
  setInterval(()=>{
    if (s <= 0) return;
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const d = s % 60;
    document.getElementById("countdown").innerText =
      `${h} jam ${m} menit ${d} detik`;
    s--;
  },1000);
}

function copyNumber(){
  navigator.clipboard.writeText(
    document.getElementById("wallet-number").innerText
  );
  alert("Nomor pembayaran disalin");
}

function checkStatus(){
  location.href =
    `/TUBES_2_Toko/backend/order/updateStatus.php?id=${trxId}`;
}

/* DUMMY DATA (nanti ganti dari API) */
document.getElementById("total").innerText = "Rp 3.306.000";
document.getElementById("deadline").innerText = "Jatuh tempo 14 Dec 2025, 01:16";

startCountdown(24 * 60 * 60);

function startCountdown(seconds){
  let s = seconds;
  setInterval(()=>{
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const d = s % 60;
    document.getElementById("countdown").innerText =
      `${h} jam ${m} menit ${d} detik`;
    s--;
  },1000);
}

function copyNumber(){
  navigator.clipboard.writeText(
    document.getElementById("wallet-number").innerText
  );
  alert("Nomor pembayaran disalin");
}

function checkStatus(){
  location.href =
    `/TUBES_2_Toko/backend/order/updateStatus.php?id=${trxId}`;
}
</script>

</body>
</html>
