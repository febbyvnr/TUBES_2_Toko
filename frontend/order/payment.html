<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Payment</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- ICON -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../styles/HomePage.css">
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/payment.css">
</head>

<body class="order-page">
<div id="header"></div>
<div class="container">
  <!-- ALAMAT -->
  <div class="section-box">
    <div class="section-title">Shipping Address</div>
    <div class="address-wrapper">
      <div class="address-left" id="address-left">Loading...</div>
      <div class="address-right" id="address-right"></div>
    </div>
  </div>
  <!-- PRODUK -->
  <div class="section-box">
    <div class="section-title">Produk Dipesan</div>
    <div class="product-header">
      <div>Produk</div>
      <div>Harga</div>
      <div>Jumlah</div>
      <div>Subtotal</div>
    </div>
    <div id="product-list"></div>
  </div>

  <!-- PAYMENT -->
  <div class="payment-container">

    <!-- LEFT -->
    <div class="section-box payment-left">
      <div class="section-title">Payment Method</div>

      <div class="method-list">
        <button class="method-btn active" id="btn-cod" onclick="selectMethod('cod')">
          Cash on Delivery
        </button>
        <button class="method-btn" id="btn-bank" onclick="selectMethod('bank')">
          Bank Transfer
        </button>
        <button class="method-btn" id="btn-ewallet" onclick="selectMethod('ewallet')">
          E-Wallet
        </button>
      </div>

      <div class="payment-detail">
        <div id="detail-cod">COD — Cash on Delivery</div>

        <div id="detail-bank" style="display:none;">
          Bank Transfer — Virtual Account
        </div>

        <div id="detail-ewallet" style="display:none;">
          Choose E-Wallet:
          <div class="ewallet-options">
            <label><input type="radio" name="ewallet_type" value="Dana" checked> Dana</label>
            <label><input type="radio" name="ewallet_type" value="OVO"> OVO</label>
            <label><input type="radio" name="ewallet_type" value="Gopay"> Gopay</label>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="section-box payment-right">
      <div class="section-title">Order Summary</div>

      <div class="summary-row">
        <span>Subtotal Product</span>
        <span id="sum-subtotal">-</span>
      </div>

      <div class="summary-row">
        <span>Subtotal Shipping</span>
        <span id="sum-shipping">-</span>
      </div>

      <div class="summary-row">
        <span>Admin Fee</span>
        <span id="sum-admin">-</span>
      </div>

      <div class="total-line">
        <span>Total Payment</span>
        <span id="sum-total">-</span>
      </div>

      <button class="btn-submit" onclick="submitPayment()">
        Place Order
      </button>
    </div>

  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>
/* HEADER & FOOTER */
fetch("../includes/header.html")
  .then(r=>r.text()).then(t=>{
    document.getElementById("header").innerHTML=t;
    window.initHeaderAuth && initHeaderAuth();
  });

fetch("../includes/footer.html")
  .then(r=>r.text()).then(t=>{
    document.getElementById("footer").innerHTML=t;
  });

const API = "/TUBES_2_Toko/backend";
let selectedMethod = "cod";

/* LOAD DATA */
fetch(API + "/order/payment.php?mode=json",{credentials:"include"})
.then(r=>r.json())
.then(d=>{
  document.getElementById("address-left").innerHTML =
    `<b>${d.shipping.firstname} ${d.shipping.lastname}</b><br>${d.shipping.email}`;

  document.getElementById("address-right").innerText = d.shipping.address;

  let html="";
  d.items.forEach(i=>{
    html+=`
    <div class="product-row">
      <div class="prod-info">
        <img src="../assets/${i.image}" alt="${i.name}">
        <div>
          <b>${i.name}</b>
          <div class="size-text">Size: ${i.size}</div>
        </div>
      </div>
      <div>Rp ${i.price.toLocaleString("id-ID")}</div>
      <div>${i.quantity}</div>
      <div><b>Rp ${i.subtotal.toLocaleString("id-ID")}</b></div>
    </div>`;
  });
  document.getElementById("product-list").innerHTML=html;

  document.getElementById("sum-subtotal").innerText =
    "Rp "+d.subtotal.toLocaleString("id-ID");
  document.getElementById("sum-shipping").innerText =
    "Rp "+d.shipping_cost.toLocaleString("id-ID");
  document.getElementById("sum-admin").innerText =
    "Rp "+d.admin_fee.toLocaleString("id-ID");
  document.getElementById("sum-total").innerText =
    "Rp "+d.total.toLocaleString("id-ID");
});

/* METHOD */
function selectMethod(m){
  selectedMethod=m;
  ["cod","bank","ewallet"].forEach(x=>{
    document.getElementById("btn-"+x).classList.remove("active");
    document.getElementById("detail-"+x).style.display="none";
  });
  document.getElementById("btn-"+m).classList.add("active");
  document.getElementById("detail-"+m).style.display="block";
}

/* SUBMIT */
function submitPayment(){
  const fd=new FormData();
  fd.append("method",selectedMethod);

  if(selectedMethod==="ewallet"){
    fd.append("ewallet_type",
      document.querySelector("input[name=ewallet_type]:checked").value);
  }

  fetch(API+"/order/processPayment.php",{method:"POST",credentials:"include",body:fd})
  .then(r=>r.json())
  .then(d=>{
    if(selectedMethod==="cod")
      location.href="payment-success.html?transaction_id="+d.transaction_id;
    if(selectedMethod==="bank")
      location.href="transfer-bank.html?transaction_id="+d.transaction_id;
    if(selectedMethod==="ewallet")
      location.href="ewallet.html?transaction_id="+d.transaction_id+"&type="+d.ewallet_type;
  });
}
</script>

</body>
</html>
