<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Add Product — Féyora</title>

  <!-- Admin styles -->
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/HomePage.css">
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/sideBar.css">
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/adminDashboard.css">
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/adminAddProducts.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-body">

<div class="admin-layout">
  <div id="sideBar"></div>
  <div class="admin-main">

    <!-- TOPBAR -->
    <header class="admin-topbar">
      <div class="admin-breadcrumb">
        <span>Home</span>
        <span class="sep">/</span>
        <span>Add Product</span>
      </div>

      <div class="admin-topbar-right">
        <span class="admin-welcome">Hi, Admin</span>
        <div class="admin-avatar-small">AD</div>
      </div>
    </header>

    <!-- FORM -->
    <form id="addProductForm" enctype="multipart/form-data">
      <main class="admin-content">

        <div class="admin-content-header">
          <h1 class="admin-page-title">Add New Product</h1>
        </div>

        <!-- PRODUCT GRID -->
        <div class="admin-product-grid">

          <!-- PRODUCT INFO -->
          <div class="admin-form-card">
            <h3 class="form-section-title">Product Information</h3>

            <label class="inputTitle">Product Name</label>
            <input type="text" name="name" class="admin-input" required>

            <label class="inputTitle">Description</label>
            <textarea name="description" class="admin-textarea" required></textarea>
          </div>

          <!-- PRODUCT IMAGE -->
          <div class="admin-form-card">
            <h3 class="form-section-title">Product Image</h3>

            <div id="dropzone" class="media-dropzone">
              <div class="media-dropzone-icon">⬆</div>
              <p class="drag-image">Drag & drop images here</p>
              <span class="browse-text">or Browse files</span>
              <input type="file" id="imageInput" name="image" accept="image/*" hidden>
            </div>

            <div id="imagePreviewContainer" class="media-preview-container"></div>

            <button type="submit" class="btn-primary-admin full">
              <i class="bi bi-check2-circle"></i> Save Product
            </button>
          </div>

          <!-- PRICE & STOCK -->
          <div class="admin-form-card">
            <h3 class="form-section-title">Pricing & Stock</h3>

            <label class="inputTitle">Price</label>
            <input type="number" name="price" class="admin-input" required>

            <label class="inputTitle">Stock</label>
            <input type="number" name="stock" class="admin-input" required>

            <label class="inputTitle">Category</label>
            <select name="category" class="admin-input" required>
              <option value="" disabled selected>-- Select Category --</option>
              <option value="Tops">Tops</option>
              <option value="Jacket">Jacket</option>
              <option value="Dress">Dress</option>
              <option value="Hoodies">Hoodies</option>
              <option value="Tshirts">Tshirts</option>
              <option value="Cardigans">Cardigans</option>
            </select>
          </div>

        </div>
      </main>
    </form>

  </div>
</div>

<!-- IMAGE PREVIEW SCRIPT -->
<script>
const dropzone = document.getElementById("dropzone");
const input = document.getElementById("imageInput");
const preview = document.getElementById("imagePreviewContainer");

dropzone.addEventListener("click", () => input.click());

input.addEventListener("change", () => {
  if (input.files[0]) showPreview(input.files[0]);
});

dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  input.files = e.dataTransfer.files;
  if (file) showPreview(file);
});

function showPreview(file) {
  const reader = new FileReader();
  reader.onload = e => {
    preview.innerHTML = `<img src="${e.target.result}" class="media-thumb">`;
  };
  reader.readAsDataURL(file);
}
</script>
<script>
    async function loadPart(id, url) {
        const el = document.getElementById(id);
        if (!el) return;
        const res = await fetch(url, { cache: "no-cache" });
        el.innerHTML = await res.text();
    }
    loadPart("sideBar", "/TUBES_2_Toko/frontend/includes/sideBar.html");
</script>
<script>
  const form = document.getElementById("addProductForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
      const fd = new FormData(form);

      const res = await fetch("/TUBES_2_Toko/backend/admin/addProducts.php", {
        method: "POST",
        body: fd,
        credentials: "include"
      });

      const ct = res.headers.get("content-type") || "";
      const raw = await res.text();

      if (!ct.includes("application/json")) {
        console.error("NOT JSON:", raw);
        alert("Server tidak mengembalikan JSON. Cek console.");
        return;
      }

      const json = JSON.parse(raw);

      if (!res.ok || json.ok === false) {
        const msg = (json.errors && json.errors.length)
          ? json.errors.join("\n")
          : (json.error || json.message || "Gagal menambah produk.");
        alert(msg);
        return;
      }

      window.location.href = "/TUBES_2_Toko/frontend/admin/dashboard.html";
    } catch (err) {
      console.error(err);
      alert("Terjadi error saat submit. Cek console.");
    }
  });
</script>
</body>
</html>
