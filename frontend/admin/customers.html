<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customers — Féyora</title>

  <!-- Global admin styles -->
  <link rel="stylesheet" href="../styles/adminDashboard.css">
  <link rel="stylesheet" href="../styles/customer.css">
  <link rel="stylesheet" href="../styles/sideBar.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-body">
<div id="sideBar"></div>
<div class="admin-layout">

  <!-- SIDEBAR (nanti bisa static HTML / include manual) -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">FEYORA</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="customers.html" class="active">Customers</a>
      <a href="#">Products</a>
      <a href="#">Orders</a>
    </nav>
  </aside>

  <div class="admin-main">

    <!-- TOPBAR -->
    <header class="admin-topbar">
      <div class="admin-breadcrumb">
        <span>Home</span>
        <span class="sep">/</span>
        <span>Customers</span>
      </div>

      <div class="admin-topbar-right">
        <span class="admin-welcome">Hi, Admin</span>
        <div class="admin-avatar-small">AD</div>
      </div>
    </header>

    <main class="admin-content">

      <!-- HEADER -->
      <div class="admin-content-header">
        <h1 class="admin-page-title">Customers</h1>
      </div>

      <!-- FILTER BAR -->
      <section class="admin-filterbar">
        <form class="filter-form" onsubmit="return false;">
          <div class="customer-searchbar">
            <i class="bi bi-search"></i>
            <input
              type="text"
              placeholder="Search username or email..."
            >
          </div>

          <div class="filter-group">
            <select class="customer-filter-select">
              <option>All Status</option>
              <option>Active</option>
              <option>Inactive</option>
            </select>

            <button class="customer-apply-btn">Apply</button>
          </div>
        </form>
      </section>

      <!-- TABLE -->
      <section class="customer-table-card">
        <table class="customer-table">
          <thead>
            <tr>
              <th>Username Email</th>
              <th>Phone</th>
              <th>Password</th>
              <th>Status</th>
              <th style="width:110px">Actions</th>
            </tr>
          </thead>

          <tbody id="customers-body">
            
          </tbody>
        </table>

        <!-- FOOTER -->
        <div class="admin-table-footer">
          <div class="table-info" id="table-info"></div>
          <div class="customer-pagination" id="pagination"></div>
        </div>
      </section>

    </main>
  </div>
</div>
<script>
const API_URL = '/TUBES_2_Toko/backend/admin/customers.php';

const tbody      = document.getElementById('customers-body');
const tableInfo = document.getElementById('table-info');
const pagination = document.getElementById('pagination');

// filter elements
const searchInput = document.querySelector('.customer-searchbar input');
const statusSelect = document.querySelector('.customer-filter-select');
const applyBtn = document.querySelector('.customer-apply-btn');

let currentPage = 1;

async function loadCustomers(page = 1) {
  const params = new URLSearchParams({
    search: searchInput.value.trim(),
    status: statusSelect.value.toLowerCase(),
    page
  });

  const res = await fetch(`${API_URL}?${params.toString()}`, {
    credentials: 'include'
  });

  const data = await res.json();

  if (!data.ok) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center;color:red;">
          ${data.error || 'Failed to load data'}
        </td>
      </tr>`;
    return;
  }

  renderTable(data.customers);
  renderFooter(data.pagination);
}

function renderTable(customers) {
  if (customers.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center;color:#777;">
          No customers found.
        </td>
      </tr>`;
    return;
  }

  tbody.innerHTML = customers.map(c => `
    <tr>
      <td>
        <div class="customer-user">
          <span class="u-name">${escapeHtml(c.username)}</span>
          <span class="u-email">${escapeHtml(c.email)}</span>
        </div>
      </td>

      <td class="customer-phone">
        ${escapeHtml(c.phone)}
      </td>

      <td class="customer-pass">
        ********
      </td>

      <td>
        ${c.status === 'active'
          ? '<span class="status-active">Active</span>'
          : '<span class="status-inactive">Inactive</span>'
        }
      </td>

      <td class="customer-actions">
        <a href="/TUBES_2_Toko/backend/admin/deleteCustomer.php?id=${c.id}"
           onclick="return confirm('Delete this customer?')">
          <i class="bi bi-trash3"></i>
        </a>
      </td>
    </tr>
  `).join('');
}

function renderFooter(p) {
  tableInfo.textContent =
    `Showing ${p.perPage > p.total ? p.total : p.perPage} of ${p.total} customers`;

  pagination.innerHTML = '';

  // Prev
  if (p.page > 1) {
    pagination.innerHTML += `<button class="page-btn">Previous</button>`;
    pagination.lastChild.onclick = () => loadCustomers(p.page - 1);
  } else {
    pagination.innerHTML += `<span class="page-btn disabled">Previous</span>`;
  }

  // Pages
  for (let i = 1; i <= p.totalPages; i++) {
    if (i === p.page) {
      pagination.innerHTML += `<span class="page-number active">${i}</span>`;
    } else {
      pagination.innerHTML += `<button class="page-number">${i}</button>`;
      pagination.lastChild.onclick = () => loadCustomers(i);
    }
  }

  // Next
  if (p.page < p.totalPages) {
    pagination.innerHTML += `<button class="page-btn">Next</button>`;
    pagination.lastChild.onclick = () => loadCustomers(p.page + 1);
  } else {
    pagination.innerHTML += `<span class="page-btn disabled">Next</span>`;
  }
}

applyBtn.addEventListener('click', () => {
  currentPage = 1;
  loadCustomers(currentPage);
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[s]));
}

// INIT
loadCustomers();
</script>
<script>
  async function loadPart(id, url) {
    const el = document.getElementById(id);
    if (!el) return;
    const res = await fetch(url, { cache: "no-cache" });
    el.innerHTML = await res.text();
  }

  // load sidebar (INI YANG KURANG)
  loadPart("sideBar", "/TUBES_2_Toko/frontend/includes/sideBar.html");
</script>
</body>
</html>
