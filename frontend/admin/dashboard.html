<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Dashboard — FEYORA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/adminDashboard.css">
    <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/sideBar.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-body">
    <div id="sideBar"></div>
    <div class="admin-layout">
        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-breadcrumb">
                    <span>Home</span>
                    <span class="sep">/</span>
                    <span>Dashboard</span>
                </div>
                <div class="admin-topbar-right">
                    <span class="admin-welcome">Hi, </span>
                    <div class="admin-avatar-small"></div>
                </div>
            </header>
            <main class="admin-content">
                <div class="admin-content-header">
                    <h1 class="admin-page-title">Dashboard</h1>
                    <button class="btn-primary-admin"
                            onclick="location.href='/TUBES_2_Toko/frontend/admin/addProducts.html'">
                        <i class="bi bi-plus-lg"></i> Add New Product
                    </button>
                </div>
                <section class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-label">Total Products</div>
                        <div class="stat-value" id="statTotalProducts">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Customers</div>
                        <div class="stat-value" id="statCustomers">0</div>
                        <div class="stat-sub" id="statCustomersActive">0 active</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Low Stock (≤ 50)</div>
                        <div class="stat-value" id="statLowStock">0</div>
                    </div>
                </section>

                <section class="admin-filterbar">
                    <form class="filter-form" id="filterForm">
                        <div class="filter-search">
                            <i class="bi bi-search"></i>
                            <input id="searchInput" type="text" placeholder="Search by product name..." />
                        </div>

                        <div class="filter-group">
                            <select id="categorySelect" class="filter-pill filter-select">
                                <option value="">Category: All</option>
                            </select>

                            <select id="stockSelect" class="filter-pill filter-select">
                                <option value="all">Stock: All</option>
                                <option value="in">In Stock (&gt; 50)</option>
                                <option value="low">Low Stock (1–50)</option>
                                <option value="out">Out of Stock (0)</option>
                            </select>

                            <select id="sortSelect" class="filter-pill filter-select">
                                <option value="newest">Sort: Newest</option>
                                <option value="oldest">Sort: Oldest</option>
                                <option value="price_asc">Price: Low → High</option>
                                <option value="price_desc">Price: High → Low</option>
                            </select>

                            <button type="submit" class="filter-apply-btn">Apply</button>
                        </div>
                    </form>
                </section>

                <section class="admin-table-card">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:40px;"><input type="checkbox"></th>
                                <th>Product Name</th>
                                <th>Stock</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th style="width:110px; text-align:center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody"></tbody>
                    </table>
                    <div class="admin-table-footer">
                        <div class="table-info" id="tableInfo"></div>
                        <div class="table-pagination" id="pagination"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const API_URL = "/TUBES_2_Toko/backend/admin/dashboard.php";
        const PER_PAGE = 20;
        const productsBody = document.getElementById("productsBody");
        const tableInfo = document.getElementById("tableInfo");
        const paginationEl = document.getElementById("pagination");
        const searchInput = document.getElementById("searchInput");
        const categorySelect = document.getElementById("categorySelect");
        const stockSelect = document.getElementById("stockSelect");
        const sortSelect = document.getElementById("sortSelect");
        const filterForm = document.getElementById("filterForm");
        let currentPage = 1;
        let lastTotalPages = 1;
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
            }[c]));
        }
        function readFilters() {
            return {
                search: searchInput.value.trim(),
                category: categorySelect.value,
                stock: stockSelect.value,
                sort: sortSelect.value
            };
        }

        function setStats(stats) {
            document.getElementById("statTotalProducts").textContent = stats.totalProducts ?? 0;
            document.getElementById("statCustomers").textContent = stats.totalCustomers ?? 0;
            document.getElementById("statLowStock").textContent = stats.totalLowStock ?? 0;
            document.getElementById("statCustomersActive").textContent =
                `${stats.totalActiveCustomers ?? 0} active`;
        }

        function fillCategories(categories) {
            const current = categorySelect.value;
            categorySelect.innerHTML = `<option value="">Category: All</option>` +
                (categories || []).map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
            categorySelect.value = current;
        }

        function renderProducts(items) {
            if (!items || items.length === 0) {
              productsBody.innerHTML = `
                  <tr>
                      <td colspan="6" style="text-align:center; padding:20px; color:#777;">
                          No products found.
                      </td>
                  </tr>`;
              return;
            }

            productsBody.innerHTML = items.map(p => {
                const stock = Number(p.stock) || 0; // ✅ ini bikin status stock bener
                let stockBadge = "";
                let statusPill = "";

                if (stock <= 0) {
                    stockBadge = `<span class="stock-badge stock-out">Out of Stock</span>`;
                    statusPill = `<span class="status-pill status-draft">Out of Stock</span>`;
                } else if (stock <= 50) {
                    stockBadge = `<span class="stock-badge stock-low">${stock} In Stock</span>`;
                    statusPill = `<span class="status-pill status-low">Low Stock</span>`;
                } else {
                    stockBadge = `<span class="stock-badge stock-ok">${stock} In Stock</span>`;
                    statusPill = `<span class="status-pill status-published">Published</span>`;
                }

                const img = p.image || "/TUBES_2_Toko/frontend/assets/products/placeholder.png";

                return `
                    <tr>
                        <td><input type="checkbox"></td>
                        <td class="cell-product">
                            <img src="${esc(img)}" class="cell-thumb">
                            <span>${esc(p.name || "")}</span>
                        </td>
                        <td>${stockBadge}</td>
                        <td>Rp ${Number(p.price || 0).toLocaleString("id-ID")}</td>
                        <td>${statusPill}</td>
                        <td class="cell-actions">
                            <a href="/TUBES_2_Toko/frontend/admin/editProducts.html?id=${encodeURIComponent(p.id)}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a href="/TUBES_2_Toko/frontend/admin/deleteProducts.php?id=${encodeURIComponent(p.id)}"
                                onclick="return confirm('Hapus produk ini?')">
                                <i class="bi bi-trash3"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        function renderPagination(page, totalPages) {
            paginationEl.innerHTML = "";
            if (!totalPages || totalPages <= 1) return;

            function btn(label, toPage, disabled = false, active = false) {
                if (disabled) return `<span class="page-btn disabled">${label}</span>`;
                if (active) return `<span class="page-number active">${label}</span>`;
                return `<button type="button" class="page-btn" data-page="${toPage}">${label}</button>`;
            }
            let html = "";
            html += btn("Previous", page - 1, page <= 1);
            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, page + 2);
            if (start > 1) html += btn("1", 1, false, page === 1);
            if (start > 2) html += `<span class="page-btn disabled">...</span>`;
            for (let i = start; i <= end; i++) {
                html += btn(String(i), i, false, i === page);
            }
            if (end < totalPages - 1) html += `<span class="page-btn disabled">...</span>`;
            if (end < totalPages) html += btn(String(totalPages), totalPages, false, page === totalPages);
            html += btn("Next", page + 1, page >= totalPages);
            paginationEl.innerHTML = html;
            paginationEl.querySelectorAll("button[data-page]").forEach(b => {
                b.addEventListener("click", () => {
                    const to = Number(b.dataset.page);
                    if (to >= 1 && to <= totalPages) loadDashboard(to);
                });
            });
        }

        async function loadDashboard(page = 1) {
            currentPage = page;

            const f = readFilters();
            const params = new URLSearchParams({
                page: String(page),
                per_page: String(PER_PAGE),
                search: f.search,
                category: f.category,
                stock: f.stock,
                sort: f.sort
            });

            try {
                const res = await fetch(`${API_URL}?${params.toString()}`, { credentials: "include" });
                if (!res.ok) throw new Error("Unauthorized or server error");

                const data = await res.json();
                if (!data.ok) throw new Error(data.error || "Invalid response");

                document.querySelector(".admin-welcome").textContent = "Hi, " + data.admin.username;
                document.querySelector(".admin-avatar-small").textContent =
                  String(data.admin.username).substring(0,2).toUpperCase();
                setStats(data.stats || {});
                fillCategories(data.meta?.categories || []);
                renderProducts(data.products || []);
                const p = data.pagination || {};
                lastTotalPages = Number(p.total_pages) || 1;
                const shown = (data.products || []).length;
                tableInfo.textContent = `Showing ${shown} of ${Number(p.total || 0)} products`;
                renderPagination(Number(p.page || 1), lastTotalPages);
            } catch (err) {
                console.error(err);
                alert("Session expired or access denied. Please login again.");
                window.location.href = "/TUBES_2_Toko/auth/login.php";
            }
        }
        filterForm.addEventListener("submit", (e) => {
            e.preventDefault();
            loadDashboard(1);
        });
        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                loadDashboard(1);
            }
        });
        loadDashboard(1);
    </script>

    <script>
        async function loadPart(id, url) {
            const el = document.getElementById(id);
            if (!el) return;
            const res = await fetch(url, { cache: "no-cache" });
            el.innerHTML = await res.text();
        }
        loadPart("sideBar", "/TUBES_2_Toko/frontend/includes/sideBar.html");
    </script>

    <script>
        document.getElementById("btnAddProduct").addEventListener("click", () => {
            window.location.href = "/TUBES_2_Toko/frontend/admin/addProducts.html";
        });
    </script>
</body>
</html>
