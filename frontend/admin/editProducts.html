<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Product — FEYORA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/adminDashboard.css">
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/adminAddProducts.css">
  <link rel="stylesheet" href="/TUBES_2_Toko/frontend/styles/sideBar.css">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-body">

<div id="sideBar"></div>

<div class="admin-layout">
  <div class="admin-main">

    <!-- TOPBAR -->
    <header class="admin-topbar">
      <div class="admin-breadcrumb">
        <span>Home</span>
        <span class="sep">/</span>
        <span>Edit Product</span>
      </div>
      <div class="admin-topbar-right">
        <span class="admin-welcome">Hi, Admin</span>
        <div class="admin-avatar-small">AD</div>
      </div>
    </header>

    <main class="admin-content">
      <div class="admin-content-header">
        <h1 class="admin-page-title">Edit Product</h1>
      </div>

      <form id="editForm">
        <input type="hidden" name="id" id="productId">

        <div class="admin-product-grid">

          <div class="admin-form-card">
            <h3 class="form-section-title">Product Information</h3>

            <label>Product Name</label>
            <input type="text" name="name" id="name" class="admin-input" required>

            <label>Description</label>
            <textarea name="description" id="description" class="admin-textarea" required></textarea>
          </div>

          <div class="admin-form-card">
            <h3 class="form-section-title">Pricing & Stock</h3>

            <label>Price</label>
            <input type="number" name="price" id="price" class="admin-input" required>

            <label>Stock</label>
            <input type="number" name="stock" id="stock" class="admin-input" required>

            <label>Category</label>
            <select name="category" id="category" class="admin-input" required>
              <option value="">-- Select Category --</option>
              <option>Tops</option>
              <option>Jacket</option>
              <option>Dress</option>
              <option>Hoodies</option>
              <option>Tshirts</option>
              <option>Cardigans</option>
            </select>

            <button type="submit" class="btn-primary-admin full">
              <i class="bi bi-check2-circle"></i> Save Changes
            </button>
          </div>

        </div>
      </form>
    </main>
  </div>
</div>

<script>
const API = "/TUBES_2_Toko/backend/admin/editProducts.php";
const id = new URLSearchParams(location.search).get("id");

// ambil elemen (hindari nama variabel "name")
const productIdEl = document.getElementById("productId");
const nameEl = document.getElementById("name");
const descEl = document.getElementById("description");
const priceEl = document.getElementById("price");
const stockEl = document.getElementById("stock");
const categoryEl = document.getElementById("category");
const formEl = document.getElementById("editForm");

async function loadProduct() {
  if (!id) {
    alert("ID produk tidak ada di URL");
    return;
  }

  const res = await fetch(`${API}?id=${encodeURIComponent(id)}`, {
    credentials: "include"
  });

  const json = await res.json();
  if (!json.ok) return alert(json.message || "Gagal load produk");

  const p = json.data;
  productIdEl.value = p.id;
  nameEl.value = p.name || "";
  descEl.value = p.description || "";
  priceEl.value = p.price ?? "";
  stockEl.value = p.stock ?? "";
  categoryEl.value = p.category || "";
}

formEl.onsubmit = async (e) => {
  e.preventDefault();

  const formData = new FormData(formEl);

  const res = await fetch(API, {
    method: "POST",
    body: formData,
    credentials: "include"
  });

  const json = await res.json();
  if (!json.ok) {
    const msg = (json.errors && json.errors.length)
      ? json.errors.join("\n")
      : (json.message || "Gagal update produk");
    return alert(msg);
  }

  alert("Product updated!");
  location.href = "/TUBES_2_Toko/frontend/admin/dashboard.html";
};

loadProduct();
</script>

<script>
async function loadPart(id, url) {
  const el = document.getElementById(id);
  if (!el) return;
  const res = await fetch(url, { cache:"no-cache" });
  el.innerHTML = await res.text();
}
loadPart("sideBar", "/TUBES_2_Toko/frontend/includes/sideBar.html");
</script>

</body>
</html>
