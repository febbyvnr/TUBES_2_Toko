<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account Activation | FEYORA</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/styles/Register.css">
</head>

<body>

  <!-- HEADER (load via JS / include static kalau mau) -->
  <div id="header"></div>

  <main class="auth-layout">

    <!-- KIRI: SLIDESHOW -->
    <section class="auth-visual">
      <div id="activate-hero"
           class="auth-visual-image"
           style="background-image:url('../assets/products/placeholder.png');">
      </div>

      <div class="auth-visual-overlay">
        <h1>Activate Your Account</h1>
        <p>
          Thank you for joining Feyora.  
          Complete your account activation to start shopping.
        </p>
      </div>
    </section>

    <!-- KANAN: STATUS AKTIVASI -->
    <section class="auth-form">
      <div class="auth-form-inner">

        <div style="text-align:center; margin-bottom:18px;">
          <img src="../assets/Logo Feyora.png"
               alt="Feyora Logo"
               style="width:150px; height:auto; opacity:0.9;">
        </div>

        <h2 class="auth-title">Account Activation</h2>

        <!-- MESSAGE AREA (diisi JS dari backend response) -->
        <div id="activation-message"></div>

        <!-- ACTION -->
        <div id="activation-action" style="margin-top:14px;"></div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <script>
    /**
     * Contoh data dummy
     * NANTI INI DIGANTI hasil fetch dari activate.php
     */
    const activationResult = {
      status: 'success', // success | info | error
      message: 'Your account has been successfully activated. Please login.'
    };

    const msgEl = document.getElementById('activation-message');
    const actionEl = document.getElementById('activation-action');

    if (activationResult.status === 'success' || activationResult.status === 'info') {
      msgEl.innerHTML = `
        <div class="auth-success">
          ${activationResult.message}
        </div>
      `;
      actionEl.innerHTML = `
        <a href="login.html"
           class="btn-primary auth-submit"
           style="display:block; text-align:center; text-decoration:none;">
          Go to Login
        </a>
      `;
    } else {
      msgEl.innerHTML = `
        <div class="auth-error">
          ${activationResult.message}
        </div>
      `;
      actionEl.innerHTML = `
        <div class="auth-meta">
          <a href="login.html">Back to Login</a> ·
          <a href="register.html">Register</a>
        </div>
      `;
    }
  </script>

</body>
</html>
