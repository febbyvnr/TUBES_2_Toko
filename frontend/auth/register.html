<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | FEYORA</title>

  <link rel="stylesheet" href="../assets/styles/header.css">
  <link rel="stylesheet" href="../assets/styles/footer.css">
  <link rel="stylesheet" href="../assets/styles/Register.css">
</head>

<body>

<div id="header"></div>

<main class="auth-layout">

  <!-- LEFT: REGISTER FORM -->
  <section class="auth-form">
    <div class="auth-form-inner">

      <div style="text-align:center; margin-bottom:18px;">
        <img src="../assets/Logo%20Feyora.png"
             alt="Feyora Logo"
             style="width:150px; height:auto; opacity:0.9;">
      </div>

      <!-- MESSAGE AREA -->
      <div id="msg-area"></div>

      <form id="register-form" class="auth-form-fields" enctype="multipart/form-data">

        <!-- username + email -->
        <div class="form-row">
          <label class="auth-label">
            Username
            <input class="auth-input" name="username" autocomplete="username" required minlength="3">
          </label>

          <label class="auth-label">
            Email
            <input class="auth-input" type="email" name="email" autocomplete="email" required>
          </label>
        </div>

        <!-- password + confirm -->
        <div class="form-row">
          <label class="auth-label">
            Password
            <input class="auth-input" type="password" name="password"
                   autocomplete="new-password" required minlength="8">
          </label>

          <label class="auth-label">
            Confirm Password
            <input class="auth-input" type="password" name="password2"
                   autocomplete="new-password" required minlength="8">
          </label>
        </div>

        <!-- phone + profile photo -->
        <div class="form-row">
          <label class="auth-label">
            Phone
            <input class="auth-input" name="phone" autocomplete="tel" required>
          </label>

          <label class="auth-label">
            Profile Photo (optional)
            <input class="auth-input" type="file" name="profile_photo" accept="image/*">
          </label>
        </div>

        <!-- address -->
        <label class="auth-label">
          Address
          <textarea class="auth-input auth-textarea"
                    name="address" rows="3" required></textarea>
        </label>

        <div class="auth-meta">
          <span>Already have an account?
            <a href="/TUBES_2_Toko/frontend/auth/login.html">Sign in</a>
          </span>
        </div>

        <button id="btn-submit" class="btn-primary auth-submit" type="submit">
          Register
        </button>
      </form>

    </div>
  </section>

  <!-- RIGHT: SLIDESHOW -->
  <section class="auth-visual">
    <div id="register-hero"
         class="auth-visual-image"
         style="background-image:url('../assets/products/placeholder.png');">
    </div>

    <div class="auth-visual-overlay">
      <h1>Create Your Account</h1>
      <p>
        Join Feyora to save your favorite looks, track orders,
        and enjoy a more personal shopping experience.
      </p>
    </div>
  </section>

</main>

<div id="footer"></div>

<script>
/* ===== load header & footer ===== */
async function loadPart(id, url) {
  const el = document.getElementById(id);
  const res = await fetch(url, { cache: "no-cache" });
  el.innerHTML = await res.text();
}
loadPart("header", "../includes/header.html");
loadPart("footer", "../includes/footer.html");

/* ===== register submit ===== */
const BACKEND = "http://localhost/TUBES_2_Toko/backend";
const form = document.getElementById("register-form");
const msg  = document.getElementById("msg-area");
const btn  = document.getElementById("btn-submit");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])
  );
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  msg.innerHTML = "";
  btn.disabled = true;

  try {
    const fd = new FormData(form);

    const res = await fetch(`${BACKEND}/auth/register.php`, {
      method: "POST",
      body: fd,
      credentials: "include"
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch {
      msg.innerHTML = `<div class="auth-error">
        Backend error:<br>${esc(text.slice(0,200))}
      </div>`;
      return;
    }

    if (!res.ok || !data.ok) {
      msg.innerHTML = `<div class="auth-error">
        ${(data.errors || ['Registration failed']).map(esc).join('<br>')}
      </div>`;
      return;
    }

    msg.innerHTML = `<div class="auth-success">${data.message}</div>`;
    form.reset();

  } catch {
    msg.innerHTML = `<div class="auth-error">Network error</div>`;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
