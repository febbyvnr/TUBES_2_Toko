<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | FEYORA</title>

  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/HomePage.css">
  <link rel="stylesheet" href="../styles/Register.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* optional: biar fade slideshow halus */
    #register-hero {
      transition: opacity .45s ease;
      opacity: 1;
    }
  </style>
</head>

<body>

<div id="header"></div>

<main class="auth-layout">

  <!-- LEFT: REGISTER FORM -->
  <section class="auth-form">
    <div class="auth-form-inner">

      <div style="text-align:center; margin-bottom:18px;">
        <img src="../assets/Logo%20Feyora.png"
             alt="Feyora Logo"
             style="width:150px; height:auto; opacity:0.9;">
      </div>

      <!-- MESSAGE AREA -->
      <div id="msg-area"></div>

      <form id="register-form" class="auth-form-fields" enctype="multipart/form-data">

        <!-- username + email -->
        <div class="form-row">
          <label class="auth-label">
            Username
            <input class="auth-input" name="username" autocomplete="username" required minlength="3">
          </label>

          <label class="auth-label">
            Email
            <input class="auth-input" type="email" name="email" autocomplete="email" required>
          </label>
        </div>

        <!-- password + confirm -->
        <div class="form-row">
          <label class="auth-label">
            Password
            <input class="auth-input" type="password" name="password"
                   autocomplete="new-password" required minlength="8">
          </label>

          <label class="auth-label">
            Confirm Password
            <input class="auth-input" type="password" name="password2"
                   autocomplete="new-password" required minlength="8">
          </label>
        </div>

        <!-- phone + profile photo -->
        <div class="form-row">
          <label class="auth-label">
            Phone
            <input class="auth-input" name="phone" autocomplete="tel" required>
          </label>

          <label class="auth-label">
            Profile Photo (optional)
            <input class="auth-input" type="file" name="profile_photo" accept="image/*">
          </label>
        </div>

        <!-- address -->
        <label class="auth-label">
          Address
          <textarea class="auth-input auth-textarea"
                    name="address" rows="3" required></textarea>
        </label>

        <div class="auth-meta">
          <span>Already have an account?
            <a href="/TUBES_2_Toko/frontend/auth/login.html">Sign in</a>
          </span>
        </div>

        <button id="btn-submit" class="btn-primary auth-submit" type="submit">
          Register
        </button>
      </form>

    </div>
  </section>

  <!-- RIGHT: SLIDESHOW -->
  <section class="auth-visual">
    <div id="register-hero"
         class="auth-visual-image"
         style="background-image:url('../assets/products/placeholder.png');">
    </div>

    <div class="auth-visual-overlay">
      <h1>Create Your Account</h1>
      <p>
        Join Feyora to save your favorite looks, track orders,
        and enjoy a more personal shopping experience.
      </p>
    </div>
  </section>

</main>

<div id="footer"></div>

<script>
/* ===== load header & footer ===== */
async function loadPart(id, url) {
  const el = document.getElementById(id);
  try {
    const res = await fetch(url, { cache: "no-cache" });
    el.innerHTML = await res.text();
  } catch {}
}
loadPart("header", "../includes/header.html");
loadPart("footer", "../includes/footer.html");

/* ===== register submit ===== */
const BACKEND = "http://localhost/TUBES_2_Toko/backend";
const form = document.getElementById("register-form");
const msg  = document.getElementById("msg-area");
const btn  = document.getElementById("btn-submit");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])
  );
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  msg.innerHTML = "";
  btn.disabled = true;

  try {
    const fd = new FormData(form);

    const res = await fetch(`${BACKEND}/auth/register.php`, {
      method: "POST",
      body: fd,
      credentials: "include"
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch {
      msg.innerHTML = `<div class="auth-error">
        Backend error:<br>${esc(text.slice(0,200))}
      </div>`;
      return;
    }

    if (!res.ok || !data.ok) {
      msg.innerHTML = `<div class="auth-error">
        ${(data.errors || ['Registration failed']).map(esc).join('<br>')}
      </div>`;
      return;
    }

    msg.innerHTML = `<div class="auth-success">${data.message}</div>`;
    form.reset();

  } catch {
    msg.innerHTML = `<div class="auth-error">Network error</div>`;
  } finally {
    btn.disabled = false;
  }
});

/* ===== slideshow (ambil dari backend/includes/sliderImages.php) ===== */
(async function () {
  const hero = document.getElementById("register-hero");
  if (!hero) return;

  // IMPORTANT: nama file harus sama persis dengan yang ada di folder
  const SLIDER_API = `${BACKEND}/includes/sliderImages.php?limit=30`;

  let images = [];
  try {
    const res = await fetch(SLIDER_API, { cache: "no-cache" });
    const json = await res.json();
    if (json && json.ok && Array.isArray(json.images)) {
      images = json.images.filter(Boolean);
    }
  } catch {}

  // fallback kalau API gagal / kosong
  if (!images.length) {
    images = ["../assets/products/placeholder.png"];
  }

  // set initial
  let idx = 0;
  hero.style.backgroundImage = `url('${images[0]}')`;

  if (images.length <= 1) return;

  setInterval(() => {
    idx = (idx + 1) % images.length;
    hero.style.opacity = 0;

    setTimeout(() => {
      hero.style.backgroundImage = `url('${images[idx]}')`;
      hero.style.opacity = 1;
    }, 350);

  }, 8000);
})();
</script>
<script>
(function showActivationMessage(){
  const p = new URLSearchParams(window.location.search);
  const activated = p.get("activated");
  const text = p.get("msg") || "";

  if (activated === "1") {
    document.getElementById("msg-area").innerHTML =
      `<div class="auth-success">${text || "Account activated. You can now login."}</div>`;
  } else if (activated === "0") {
    document.getElementById("msg-area").innerHTML =
      `<div class="auth-error">${text || "Activation failed."}</div>`;
  } else {
    return;
  }

  // bersihin query biar ga muncul lagi pas refresh
  p.delete("activated"); p.delete("msg");
  const newUrl = window.location.pathname + (p.toString() ? ("?" + p.toString()) : "");
  window.history.replaceState({}, "", newUrl);
})();
</script>
<script>
async function loadPart(id, url) {
  const el = document.getElementById(id);
  const res = await fetch(url, { cache: "no-cache" });
  el.innerHTML = await res.text();

  if (id === "header" && window.initHeaderAuth) {
    await window.initHeaderAuth();
  }
}

loadPart("header", "/TUBES_2_Toko/frontend/includes/header.html");
</script>
</body>
</html>
