<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FEYORA — Home</title>

    <link rel="stylesheet" href="styles/HomePage.css">
    <link rel="stylesheet" href="styles/header.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<div id="header"></div>
<main>
      <section class="hero">
          <div class="container hero-inner">
              <p class="lead">
                  Discover fresh styles and vibrant tops for the new season.
                  Effortless elegance, designed for you.
              </p>
              <a class="btn-primary" href="frontend/product/listProduct.html">Shop Now</a>
          </div>
      </section>

      <!-- SHOP BY CATEGORY -->
      <section class="container categories">
          <h3 class="section-title">Shop by Category</h3>

          <div class="category-carousel">
              <div class="cards" id="categoryCards"></div>
          </div>
      </section>

      <!-- FEATURED COLLECTION -->
      <section class="container featured">
          <h3 class="section-title">Featured Collection: Studio Collection</h3>

          <div class="featured-carousel">
              <div class="featured-track" id="featuredStudio"></div>
          </div>
      </section>
</main>

<div id="footer"></div>
<script>
    async function loadPart(id, url) {
        const el = document.getElementById(id);
        if (!el) return;

        const res = await fetch(url, { cache: "no-cache" });
        const html = await res.text();
        el.innerHTML = html;

        el.querySelectorAll("script").forEach(oldScript => {
            const s = document.createElement("script");
            if (oldScript.src) s.src = oldScript.src;
            s.textContent = oldScript.textContent;
            document.body.appendChild(s);
            oldScript.remove();
        });

        if (id === "header" && window.initHeaderAuth) {
            await window.initHeaderAuth();
        }
    }

    (async function () {
        await loadPart("header", "/TUBES_2_Toko/frontend/includes/header.html");
        await loadPart("footer", "/TUBES_2_Toko/frontend/includes/footer.html");
    })();
</script>
<script>
    const API_HOME = "/TUBES_2_Toko/backend/index.php";
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));}
    async function loadHome() {
        const catEl = document.getElementById("categoryCards");
        const featEl = document.getElementById("featuredStudio");
        try {
            const res = await fetch(API_HOME, { credentials: "include" });
            const json = await res.json();
            if (!json.ok) throw new Error("API not ok");
            const cats = json.data.categories || [];
            catEl.innerHTML = cats.length ? cats.map(c => `
                <div class="card">
                    <a href="${esc(c.link)}">
                        <div class="card-media" style="background-image:url('${esc(c.image)}');"></div>
                        <div class="card-caption">${esc(c.category)}</div>
                    </a>
                </div>
            `).join("") : `<p class="muted">No categories.</p>`;
            const feats = json.data.featuredStudio || [];
            featEl.innerHTML = feats.length ? feats.map(p => `
                <a class="featured-card" href="${esc(p.link)}">
                    <div class="featured-media" style="background-image:url('${esc(p.image)}');"></div>
                    <div class="featured-meta">
                        <div class="featured-title">${esc(p.title)}</div>
                        ${p.price ? `<div class="featured-price">${esc(p.price)}</div>` : ``}
                    </div>
                </a>
            `).join("") : `<p class="muted">No Studio Collection products.</p>`;
        } catch (e) {
            catEl.innerHTML = `<p class="muted">Failed load categories.</p>`;
            featEl.innerHTML = `<p class="muted">Failed load featured.</p>`;
        }
    }

    loadHome();
</script>
</body>
</html>
